{% extends "base.html" %}
{% block title %}{{ page.title }} — {{ site.title }}{% endblock %}
{% block content %}
<article class="site-page">
  <h1 class="site-page__title">{{ page.title }}</h1>
  {% if page.description %}<p class="site-lede">{{ page.description }}</p>{% endif %}
  <div class="site-prose">{{ page.content | safe }}</div>
</article>
{% endblock %}
