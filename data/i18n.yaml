# Every string the site chrome and the client-side demo layer need, per language.
#
# Why a data file and not template conditionals: seite exposes data/*.yaml as `data` in every
# template (measured; the shortcode context does NOT get it, but page templates do), and Tera can
# index it with a variable key — so `data.i18n[lang].preview` works and one template serves both
# languages. scripts/verify-i18n.mjs asserts that en and zh have exactly the same keys.
#
# Rules: class names, attribute names, token names, element names and commands are never translated;
# the two language names in the switcher are each language's own name and live in
# templates/_i18n_switcher.html, not here.
