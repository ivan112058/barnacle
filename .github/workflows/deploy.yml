name: Deploy to GitHub Pages

# seite's own GitHub Pages workflow (seite 0.20.1 `seite init --deploy-target github-pages`,
# see D:\code\barnacle-notes\seite-findings.md §9) with this repository's build chain inserted
# ahead of it. No gh CLI: only actions/upload-pages-artifact and actions/deploy-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 26 to match the version the artifacts were built and committed with locally
      # (v26.10.0). If that runtime is ever missing from the runner image, 'lts/*' is the
      # fallback — esbuild output is version-independent, but the artifact bytes are not
      # re-verified for a different Node major until this workflow is re-run.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      # install.sh puts the binary in ~/.local/bin and does NOT touch PATH (seite-findings
      # §9.1), so the directory has to be exported explicitly or every later step fails with
      # "seite: command not found".
      - name: Install seite (pinned to the local version)
        run: |
          curl -fsSL https://seite.sh/install.sh | VERSION=v0.20.1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # $GITHUB_PATH only applies to later steps, so the version has to be checked in its own
      # step. Ticket 03 asks for the exact version to be readable in the CI log; `test` makes
      # a drifted install fail the run instead of silently deploying a different seite.
      - name: Assert the seite version
        run: |
          seite --version
          test "$(seite --version)" = "seite 0.20.1"

      - name: Install JS dependencies
        run: npm ci

      - name: Build the published artifacts into static/
        run: npm run build

      # Ticket 24: the committed static/ artifacts must be exactly what CI rebuilds, otherwise
      # jsDelivr and the raw URLs would serve something other than this commit.
      - name: Assert the committed artifacts are not stale
        run: git diff --exit-code -- static/

      - name: Run the build-chain verification
        run: node scripts/verify.mjs

      - name: Run the theme verification
        run: node scripts/verify-theme.mjs

      - name: Run the site verification
        run: node scripts/verify-site.mjs

      # --strict turns broken-link / missing-asset warnings into build failures, which is what
      # this repo verifies locally (orchestrator-decisions §6). `seite upgrade --check` is
      # deliberately never run: it always exits non-zero because it wants to write the agent
      # scaffolding (orchestrator-decisions §7).
      - name: Build the site
        run: seite build --strict

      - name: Validate the site
        run: seite check --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
