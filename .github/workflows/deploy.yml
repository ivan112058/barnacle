name: Deploy to GitHub Pages

# The workflow seite 0.20.1 writes itself (`seite init --deploy-target github-pages`) with this
# repository's build chain inserted ahead of it. No gh CLI: only actions/upload-pages-artifact
# and actions/deploy-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `actions/deploy-pages` can only publish to a Pages site that already exists, and creating
      # one normally means flipping a setting in the repository UI. `enablement: true` lets this
      # run create it with the workflow's own token (source = GitHub Actions), so the first run
      # after a fresh clone is self-sufficient; on every later run the call is a no-op.
      - name: Configure Pages (create the site on the first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Node 26 to match the version the artifacts were built and committed with locally
      # (v26.10.0). If that runtime is ever missing from the runner image, 'lts/*' is the
      # fallback — esbuild output is version-independent, but the artifact bytes are not
      # re-verified for a different Node major until this workflow is re-run.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      # Measured on seite 0.20.1: install.sh puts the binary in ~/.local/bin and does NOT touch
      # PATH, so the directory has to be exported explicitly or every later step fails with
      # "seite: command not found".
      - name: Install seite (pinned to the local version)
        run: |
          curl -fsSL https://seite.sh/install.sh | VERSION=v0.20.1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # $GITHUB_PATH only applies to later steps, so the version has to be checked in its own
      # step. Ticket 03 asks for the exact version to be readable in the CI log; `test` makes
      # a drifted install fail the run instead of silently deploying a different seite.
      - name: Assert the seite version
        run: |
          seite --version
          test "$(seite --version)" = "seite 0.20.1"

      - name: Install JS dependencies
        run: npm ci

      - name: Build the published artifacts into static/
        run: npm run build

      # Ticket 24: the committed static/ artifacts must be exactly what CI rebuilds, otherwise
      # jsDelivr and the raw URLs would serve something other than this commit.
      - name: Assert the committed artifacts are not stale
        run: git diff --exit-code -- static/

      - name: Run the build-chain verification
        run: node scripts/verify.mjs

      - name: Run the theme verification
        run: node scripts/verify-theme.mjs

      # The component-level audits: a stylesheet-only bill of materials (no dist/ needed, so they
      # gate the build as early as the artifact the build just wrote).
      - name: Run the static component verification
        run: node scripts/verify-static.mjs

      - name: Run the interaction-geometry verification
        run: node scripts/verify-interaction.mjs

      - name: Run the site verification
        run: node scripts/verify-site.mjs

      # Ticket 23: content/**/*.zh.md is GENERATED from content/**/*.md + i18n/zh/** sidecars, so it
      # has to be (re)generated before seite reads the content directory — and the generation has to
      # be idempotent, which is what --check asserts. Check first (that is the assertion that
      # matters), then write, so a stale commit fails the run instead of being silently repaired.
      - name: Assert the committed Chinese pages match their sidecars
        run: npm run i18n:check

      - name: Generate the Chinese pages
        run: npm run i18n

      # Same idea as the static/ check above: whatever the generator had to write must already be
      # committed, otherwise the deployed site would differ from the commit it was built from.
      - name: Assert the committed Chinese pages are not stale
        run: git diff --exit-code -- content/

      # --strict turns broken-link / missing-asset warnings into build failures, which is what
      # this repo verifies locally by running the same two commands (seite build / seite check,
      # both with --strict). `seite upgrade --check` is deliberately never run: it always exits
      # non-zero because it wants to write the agent scaffolding.
      - name: Build the site
        run: seite build --strict

      - name: Validate the site
        run: seite check --strict

      # Needs dist/, so it runs after the build. The browser checks inside skip themselves in CI
      # (playwright-core installs, but there is no Chrome binary); the static checks decide the exit
      # code, exactly like scripts/verify-demo.mjs.
      - name: Verify the bilingual site
        run: npm run verify:i18n

      # The rest of the audits that read the built site rather than the sources.
      - name: Run the base-layer verification
        run: node scripts/verify-base.mjs

      - name: Run the layout and utilities verification
        run: node scripts/verify-layout.mjs

      # The v1 acceptance gate, offline half: the crawl, the asset list, the bilingual pairs and
      # the per-file consumption recipe, all from this build. --no-browser keeps it honest on a
      # runner with no Chrome — the Chrome half is what `npm run verify:release -- --live` adds
      # once the site is published.
      - name: Verify the release gate (offline)
        run: node scripts/verify-release.mjs --no-browser

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
